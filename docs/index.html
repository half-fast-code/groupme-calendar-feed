<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GroupMe Calendar Feed</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f7f9fc;
            color: #333;
            max-width: 680px;
            margin: 60px auto;
            padding: 24px;
        }
        .card {
            background: white;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        h1 { margin-top: 0; color: #0070f3; }
        code {
            background: #eee;
            padding: 4px 8px;
            border-radius: 4px;
            word-break: break-all;
            display: block;
            margin: 12px 0;
            font-size: 14px;
        }
        a.btn {
            display: inline-block;
            background: #0070f3;
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 6px;
            margin-top: 12px;
            font-weight: 600;
        }
        .status {
            color: #666;
            font-size: 13px;
            margin-top: 24px;
            border-top: 1px solid #eee;
            padding-top: 12px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>GroupMe Calendar Feed</h1>
        <p>This feed automatically syncs your GroupMe group events.</p>
        <p><strong>Direct iCal Feed URL:</strong></p>
        <code>events.ics</code>
        <a class="btn" href="events.ics">Download / View iCal File</a>
        <div class="status">
            Last updated: 2026-11-01 18:56:16 UTC &bull; Active events: 2
        </div>
    </div>
</body>
</html>
